<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <title>Entrar — App música</title>
</head>
<body>

  <div class="tela-login">

    <!-- Lado decorativo -->
    <div class="lado-arte">
      <div class="arte-conteudo">
        <div class="app-icone-grande"></div>
        <h1>Sua música, sem limites.</h1>
        <p>Descubra novos artistas, crie suas playlists e ouça de onde estiver.</p>

        <!-- Espaço para uma ilustração/imagem de destaque -->
        <div class="imagem-placeholder imagem-hero"></div>
      </div>
      <div class="brilho brilho-1"></div>
      <div class="brilho brilho-2"></div>
    </div>

    <!-- Formulário -->
    <div class="lado-formulario">
      <div class="cartao-login">

        <div class="abas">
          <button class="aba ativa" id="aba-entrar">Entrar</button>
          <button class="aba" id="aba-criar">Criar conta</button>
        </div>

        <!-- ===== Formulário de login ===== -->
        <form id="form-entrar" class="formulario-login">
          <label class="campo-label">E-mail</label>
          <input type="email" id="entrar-email" class="campo-texto" placeholder="seuemail@exemplo.com" required />
          <span class="erro-campo" id="erro-entrar-email"></span>

          <label class="campo-label">Senha</label>
          <div class="campo-senha-wrap">
            <input type="password" id="entrar-senha" class="campo-texto" placeholder="••••••••" required />
            <button type="button" class="botao-olho" id="olho-entrar" aria-label="Mostrar senha">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8Z"/>
                <circle cx="8" cy="8" r="2"/>
              </svg>
            </button>
          </div>
          <span class="erro-campo" id="erro-entrar-senha"></span>

          <a href="#" class="link-esqueci" id="link-esqueci">Esqueci minha senha</a>

          <button type="submit" class="botao-primario">Entrar</button>
        </form>

        <!-- ===== Formulário de cadastro ===== -->
        <form id="form-criar" class="formulario-login" style="display:none">
          <label class="campo-label">Nome de usuário</label>
          <input type="text" id="criar-username" class="campo-texto" placeholder="ex: seuusuario" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9._-]+" />
          <span class="erro-campo" id="erro-criar-username"></span>

          <label class="campo-label">Nome</label>
          <input type="text" id="criar-nome" class="campo-texto" placeholder="Seu nome" required />
          <span class="erro-campo" id="erro-criar-nome"></span>

          <label class="campo-label">E-mail</label>
          <input type="email" id="criar-email" class="campo-texto" placeholder="seuemail@exemplo.com" required />
          <span class="erro-campo" id="erro-criar-email"></span>

          <label class="campo-label">Senha</label>
          <div class="campo-senha-wrap">
            <input type="password" id="criar-senha" class="campo-texto" placeholder="Mínimo 8 caracteres" required minlength="8" />
            <button type="button" class="botao-olho" id="olho-criar" aria-label="Mostrar senha">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8Z"/>
                <circle cx="8" cy="8" r="2"/>
              </svg>
            </button>
          </div>
          <div class="medidor-forca" id="medidor-forca"><span></span></div>
          <span class="erro-campo" id="erro-criar-senha"></span>

          <label class="campo-label">Confirmar senha</label>
          <input type="password" id="criar-confirmar" class="campo-texto" placeholder="••••••••" required />
          <span class="erro-campo" id="erro-criar-confirmar"></span>

          <label class="linha-termos">
            <input type="checkbox" id="criar-termos" required />
            <span>Eu li e aceito os termos de uso</span>
          </label>

          <button type="submit" class="botao-primario">Criar conta</button>
        </form>

        <p class="nota-seguranca">
          ⚠ Esta é uma tela de demonstração para fins de testes — o acesso usa o
          backend local. Não use senhas reais aqui.
        </p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
